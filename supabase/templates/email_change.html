<h2>Confirm your new email address</h2>

<p>Tap the button below to confirm <b>{{ .NewEmail }}</b> as the email address for your Zest Snap account.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change" style="display:inline-block;background:#0B1F3B;color:#ffffff;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:700">Confirm email address</a></p>
<p>If you didn't ask to change your email, ignore this email and your address stays the same.</p>
