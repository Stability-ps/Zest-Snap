<h2>Reset your Zest Snap password</h2>

<p>We received a request to reset your password. Tap the button below to choose a new one.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#0B1F3B;color:#ffffff;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:700">Reset password</a></p>
<p>This link works once and expires in 1 hour.</p>
<p>If you didn't request this, you can safely ignore this email. Your password won't change.</p>
